name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    name: fmt, validate, secrets encrypted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v1
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false
      - run: tofu validate
      - name: Secrets file holds only ciphertext
        run: make secrets-check
